[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 83"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "aiq-stateful-python"
version = "0.1.0"
description = "Request-scoped persistent Python analysis kernel for NVIDIA AI-Q"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "aiq-agent==2.2.0",
    "nvidia-nat-core==1.8.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[project.entry-points."nat.plugins"]
stateful_python = "stateful_python.register"
