[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 83"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "aiq-bounded-python"
version = "0.1.0"
description = "Bounded stateful Python analysis tool for NVIDIA AI-Q"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-core==1.8.0",
    "pydantic>=2.0.0",
]

[project.entry-points."nat.plugins"]
bounded_python = "bounded_python.register"
