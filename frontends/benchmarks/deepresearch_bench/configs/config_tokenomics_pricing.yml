# Tokenomics pricing only (not loaded by `nat eval`).
#
# NAT's top-level config schema rejects unknown keys; keep `tokenomics` here and pass
# this file to `python -m aiq_agent.tokenomics.report --config ...`.
#
# Prices are USD per 1 million tokens. Tool costs are USD per invocation.
#
# Optional: mirror `eval.general.output_dir` from your profiling eval config so the
# report defaults to the same folder as the trace when you omit `--output`.

eval:
  general:
    output_dir: frontends/benchmarks/deepresearch_bench/results

tokenomics:
  pricing:
    models:
      "nvidia/nemotron-3-ultra-550b-a55b":
        # NVIDIA-hosted API access used by this profile. Self-hosting is not free.
        input_per_1m_tokens: 0.00
        output_per_1m_tokens: 0.00
      "nvidia/nemotron-3.5-lightning-30b-a3b":
        # NVIDIA-hosted API access used by this profile. Self-hosting is not free.
        input_per_1m_tokens: 0.00
        output_per_1m_tokens: 0.00
    tools:
      # Tavily pay-as-you-go is $0.008/credit: basic uses 1 credit,
      # advanced uses 2. Monthly plans have lower effective rates.
      "web_search_tool":
        cost_per_call: 0.008
      "advanced_web_search_tool":
        cost_per_call: 0.016
      # The shipped paper-search tool defaults to Serper. This is Serper's
      # Starter rate ($50 / 50,000 successful queries); change it for your tier
      # or when selecting SerpAPI/SearchAPI instead.
      "paper_search":
        cost_per_call: 0.001
